<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Rock Paper Scissor</title>
  </head>
  <body>
    <h1>Rock Paper Scissor Game :)</h1>
    <div class="container">
      <div class="item" id="Rock">
        <img src="assets/hand.png" />
        <p>Rock</p>
      </div>
      <div class="item" id="paper">
        <img src="assets/hand-paper.png" />
        <p>Paper</p>
      </div>
      <div class="item" id="scissor">
        <img src="assets/scissors.png" />
        <p>scissors</p>
      </div>
    </div>
    <div class="Scores">
      <div class="item">
        <p id="user-score">0</p>
        <p>Your Score</p>
      </div>
      <div class="item">
        <p id="Computer-score">0</p>
        <p>Computer's Score</p>
      </div>
    </div>
    <div class="msg-container">
      <h4 id="msg">Pick your move</h4>
    </div>
    <button id="Reset">Reset Game</button>
    <script src="app.js"></script>
  </body>
</html>
